name: Deploy to production

on:
  workflow_run:
    workflows: ["Release Gates"]
    types: [completed]
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  delivery:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------------------------
      # VERSIONING (shared for both images)
      # ---------------------------
      - name: Application version
        id: semver-app
        uses: paulhatch/semantic-version@v5.4.0
        with:
          bump_each_commit: true

      - name: Echo version
        run: |
          echo "Version: ${{ steps.semver-app.outputs.version }}"

      # ---------------------------
      # LOGIN TO GHCR
      # ---------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # BUILD BACKEND IMAGE
      # ---------------------------
      - name: Build and push API image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}-api:staging \
            -t ghcr.io/${{ github.repository }}-api:${{ steps.semver-app.outputs.version }} \
            -f api/Dockerfile \
            ./api

          docker push ghcr.io/${{ github.repository }}-api --all-tags

      # ---------------------------
      # BUILD FRONTEND IMAGE
      # ---------------------------
      - name: Build and push CLIENT image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}-client:staging \
            -t ghcr.io/${{ github.repository }}-client:${{ steps.semver-app.outputs.version }} \
            -f client/Dockerfile \
            ./client

          docker push ghcr.io/${{ github.repository }}-client --all-tags

      # ---------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------
      - name: Create release notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver-app.outputs.version }}
          name: Release ${{ steps.semver-app.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true
          body: |
            Version: ${{ steps.semver-app.outputs.version }}
            Commit: ${{ github.event.workflow_run.head_sha }}

            Images:
            - ghcr.io/${{ github.repository }}-api:${{ steps.semver-app.outputs.version }}
            - ghcr.io/${{ github.repository }}-client:${{ steps.semver-app.outputs.version }}

      # ---------------------------
      # DEPLOY COMPOSE FILE
      # ---------------------------
      - name: Deliver Docker Compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          source: compose.deploy.yml
          target: ~/dowa/

      # ---------------------------
      # REMOTE DEPLOY
      # ---------------------------
      - name: Run Docker Compose on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            cd ~/dowa

            docker compose -f compose.deploy.yml pull
            docker compose -f compose.deploy.yml up -d