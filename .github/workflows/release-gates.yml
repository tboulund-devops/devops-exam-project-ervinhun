name: Release Gates

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  migrate-db-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Flyway migrations to staging
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/server/flyway/migrations:/flyway/sql" \
            redgate/flyway:11.12.0 \
            -url="${{ secrets.STAGING_DB_URL }}" \
            -user="${{ secrets.STAGING_DB_USER }}" \
            -password="${{ secrets.STAGING_DB_PASSWORD }}" \
            -connectRetries=60 \
            migrate

  e2e-core-feature:
    runs-on: ubuntu-latest
    needs: migrate-db-staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ./test/test.csproj

      - name: Build
        run: dotnet build ./test/test.csproj --no-restore --configuration Release

      - name: Run one E2E core feature test
        run: dotnet test ./test/test.csproj --no-build --configuration Release --filter "FullyQualifiedName~TaskControllerTests.MoveTask_ValidData_WritesStatusHistory"

  k6-performance-smoke:
    runs-on: ubuntu-latest
    needs: migrate-db-staging
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ToDoApp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ToDoApp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Restore and build API
        run: |
          dotnet restore ./server/server.csproj
          dotnet build ./server/server.csproj --no-restore --configuration Release

      - name: Start API in background
        env:
          CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=ToDoApp;Username=postgres;Password=postgres
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
        run: |
          nohup dotnet run --project ./server/server.csproj --configuration Release > api.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/swagger/v1/swagger.json > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          cat api.log
          exit 1

      - name: Run k6 performance smoke test
        env:
          BASE_URL: http://127.0.0.1:5000
        run: k6 run ./LoadTesting.Tests/pipeline-smoke.js

      - name: Print API logs on failure
        if: failure()
        run: cat api.log

  migrate-db-production:
    runs-on: ubuntu-latest
    needs: [e2e-core-feature, k6-performance-smoke]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Flyway migrations to production
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/server/flyway/migrations:/flyway/sql" \
            redgate/flyway:11.12.0 \
            -url="${{ secrets.PRODUCTION_DB_URL }}" \
            -user="${{ secrets.PRODUCTION_DB_USER }}" \
            -password="${{ secrets.PRODUCTION_DB_PASSWORD }}" \
            -connectRetries=60 \
            migrate

