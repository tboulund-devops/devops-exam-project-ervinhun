services:
  api:
    image: ${IMAGE_REPO}:${IMAGE_TAG:-staging}
    container_name: todowithextras-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      CONNECTION_STRING: ${CONNECTION_STRING}

